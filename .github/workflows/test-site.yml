name: Update test site

# Tells prudwesh/kpr-test to rebuild test.kprapps.online whenever this repo's
# main or test branch changes. The test site shows the `test` branch when
# there is one, otherwise main. Uses the KPR_CROSS_REPO_TOKEN secret, which
# needs Contents = Read & write on prudwesh/kpr-test.

on:
  push:
    branches: [main, test]
  delete:

jobs:
  rebuild:
    if: github.event_name == 'push' || github.event.ref == 'test'
    runs-on: ubuntu-latest
    steps:
      - name: Ask kpr-test to rebuild
        env:
          TOKEN: ${{ secrets.KPR_CROSS_REPO_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/prudwesh/kpr-test/dispatches \
            -d "{\"event_type\":\"rebuild\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\",\"ref\":\"${{ github.event.ref || github.ref_name }}\"}}"
