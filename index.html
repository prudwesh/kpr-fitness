<style>
  :root {
    --bg: #0a0e18;
    --side: #0d1321;
    --card: #121a2c;
    --card-2: #182238;
    --card-3: #213050;
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.14);
    --text: #eef2f8;
    --text-2: #b8c2d6;
    --muted: #7d889e;
    --accent: #00d4a4;
    --accent-2: #3b82f6;
    --accent-ink: #03211b;
    --accent-soft: rgba(0,212,164,.13);
    --danger: #ff5c7a;
    --warn: #f5b942;
    --good: #22c55e;
    --glass: rgba(10,14,24,.8);
    --shadow: 0 20px 50px -20px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #f6f7fb;
    --side: #ffffff;
    --card: #ffffff;
    --card-2: #eff2f7;
    --card-3: #e2e7f0;
    --line: rgba(15,23,42,.08);
    --line-2: rgba(15,23,42,.15);
    --text: #0f172a;
    --text-2: #334155;
    --muted: #64748b;
    --accent: #00a884;
    --accent-2: #2563eb;
    --accent-ink: #ffffff;
    --accent-soft: rgba(0,168,132,.1);
    --good: #16a34a;
    --glass: rgba(246,247,251,.85);
    --shadow: 0 20px 50px -22px rgba(15,23,42,.3);
    color-scheme: light;
  }
  /* Shared KPR appearance: the theme picked in any KPR app (KPR Finance's
     packs, light / dark) drives these. Tokens: core.kprapps.online/kpr-theme.css */
  :root[data-kpr-pack] {
    --bg: var(--kpr-bg); --side: var(--kpr-side);
    --card: var(--kpr-card); --card-2: var(--kpr-alt); --card-3: var(--kpr-alt2);
    --line: var(--kpr-border); --line-2: var(--kpr-border2);
    --text: var(--kpr-ink); --text-2: var(--kpr-ink2); --muted: var(--kpr-muted);
    --accent: var(--kpr-accent); --accent-2: var(--kpr-accent2); --accent-ink: var(--kpr-on-accent); --accent-soft: var(--kpr-accent-soft);
    --danger: var(--kpr-bad); --warn: var(--kpr-warn); --glass: var(--kpr-glass); --shadow: var(--kpr-shadow);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.45 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  .hidden { display: none !important; }
  svg { flex-shrink: 0; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  /* layout */
  .content { max-width: 1180px; margin: 0 auto; padding: 20px 24px 140px; }
  .page-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin: 4px 0 18px; }
  .page-h h1 { font-size: 24px; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
  .page-h p { margin: 4px 0 0; color: var(--muted); }
  .page-h .grow { flex: 1; min-width: 200px; }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .span2 { grid-column: span 2; }
  .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 320px) minmax(0, 1fr); align-items: start; }
  .split.rev { grid-template-columns: minmax(0, 1fr) minmax(0, 340px); }
  .split.mus { grid-template-columns: minmax(0, 150px) minmax(0, 1fr); align-items: center; }
  .rgrid { grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
  .split.mus .bodymap svg { max-width: 70px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
  .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card-h h2, .card-h h3 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; min-width: 0; }
  .card-h .sub { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .sec-t { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; margin: 26px 0 12px; }

  /* buttons & inputs */
  .btn { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--text); font-weight: 650; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
  .btn:hover { background: var(--card-3); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--danger); }
  .btn.ghost { background: none; border-color: transparent; }
  .btn.ghost:hover { background: var(--card-2); }
  .btn.sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 9px; }
  .btn.lg { height: 48px; padding: 0 20px; font-size: 15px; border-radius: 12px; }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .5; cursor: default; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid transparent; background: none; color: var(--text-2); display: inline-grid; place-items: center; cursor: pointer; padding: 0; flex-shrink: 0; }
  .icon-btn:hover { background: var(--card-2); color: var(--text); }
  .icon-btn.sm { width: 30px; height: 30px; border-radius: 8px; }
  .icon-btn.on { color: var(--warn); }
  .input, .select, .textarea { height: 38px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--card); color: var(--text); width: 100%; min-width: 0; }
  .textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 70px; line-height: 1.45; }
  .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); }
  .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin: 12px 0 6px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > .grow { flex: 1; min-width: 0; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .chip { height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); background: var(--card); color: var(--text-2); font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; background: var(--card-2); color: var(--text-2); font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .tag.acc { background: var(--accent-soft); color: var(--accent); }
  .seg { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--card-2); border: 1px solid var(--line); gap: 2px; }
  .seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--text-2); font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.2); }

  /* stat tiles */
  .stat { display: grid; gap: 2px; }
  .stat b { font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .stat small { color: var(--text-2); font-size: 12px; }

  /* today */
  .hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; background: linear-gradient(135deg, var(--accent-soft), transparent 70%), var(--card); }
  .hero h1 { margin: 0 0 6px; font-size: 26px; letter-spacing: -.02em; }
  .hero p { margin: 0 0 16px; color: var(--text-2); }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring svg { transform: rotate(-90deg); }
  .ring div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring b { font-size: 28px; font-weight: 800; line-height: 1; }
  .ring span { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { display: grid; justify-items: center; gap: 6px; padding: 8px 0; border-radius: 10px; font-size: 11.5px; color: var(--muted); font-weight: 600; }
  .day i { width: 30px; height: 30px; border-radius: 50%; border: 2px dashed var(--line-2); display: grid; place-items: center; font-style: normal; color: var(--accent-ink); }
  .day.done i { background: var(--accent); border: 0; }
  .day.today { background: var(--card-2); color: var(--text); }

  /* body map */
  .bodymap { display: flex; gap: 6px; justify-content: center; }
  .bodymap svg { width: 100%; max-width: 120px; height: auto; }
  .bodymap .sil { fill: var(--card-2); }
  .bodymap .m { fill: var(--card-3); stroke: var(--card); stroke-width: .8; transition: fill .2s; }
  .bodymap .lbl-fb { font-size: 7px; fill: var(--muted); text-anchor: middle; font-weight: 600; }
  .mini-map svg { width: 36px; height: 72px; }
  .legend { display: flex; gap: 14px; justify-content: center; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

  /* exercise library */
  .lib-bar { display: grid; gap: 10px; margin-bottom: 14px; position: sticky; top: var(--stick-top, 104px); z-index: 5; background: var(--bg); padding: 10px 0 6px; }
  .lib-filters { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .lib-more { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .lib-more[hidden] { display: none; }
  .ex-thumb { width: 64px; height: 48px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: #eef2f7; border: 1px solid var(--line); }
  .ex-thumb.drawn { object-fit: contain; }
  /* Progress, History and Body: one tab, switched here */
  .subnav { display: flex; gap: 4px; padding: 4px; margin: 0 0 14px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); }
  .subnav a { flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; font-weight: 650; font-size: 13.5px; color: var(--text-2); text-decoration: none; }
  .subnav a.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  /* Workout: warm-up as a simple checklist */
  .wrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: var(--card); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .wrow .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 650; color: var(--text); background: none; border: 0; text-align: left; cursor: pointer; padding: 0; }
  .wrow .wt { color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .wrow .ok { width: 44px; height: 40px; border-radius: 10px; border: 0; background: var(--card-2); color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; flex-shrink: 0; }
  .wrow.done { background: color-mix(in srgb, var(--good) 10%, var(--card)); }
  .wrow.done .ok { background: var(--good); color: #fff; }
  .wrow.done .nm { text-decoration: line-through; text-decoration-color: var(--muted); }
  .wk-hint { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); color: var(--text-2); font-size: 13px; }
  .upnext { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); margin: 0 0 14px; }
  .upnext small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
  .upnext b { display: block; font-size: 15.5px; }
  .ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .ex-card { display: flex; gap: 12px; align-items: center; padding: 12px 12px 12px 10px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; min-width: 0; transition: border-color .12s, transform .12s; }
  .ex-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
  .ex-card.sel { border-color: var(--accent); background: var(--accent-soft); }
  .ex-card .t { flex: 1; min-width: 0; display: grid; gap: 5px; }
  .ex-card .t b { font-size: 14px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-card .t span { display: flex; gap: 5px; flex-wrap: wrap; }
  .ex-card .star { color: var(--warn); }
  .ex-card .check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line-2); display: grid; place-items: center; color: transparent; flex-shrink: 0; }
  .ex-card.sel .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .count { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
  .empty b { display: block; color: var(--text); font-size: 16px; margin-bottom: 6px; }

  /* workout logger */
  .wk-top { position: sticky; top: calc(var(--stick-top, 104px) + 8px); z-index: 6; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line-2); margin-bottom: 14px; flex-wrap: wrap; }
  .wk-top .wk-name { flex: 1; min-width: 160px; background: none; border: 0; font-size: 18px; font-weight: 750; padding: 4px 0; letter-spacing: -.01em; }
  .wk-top .wk-name:focus { outline: none; border-bottom: 2px solid var(--accent); }
  .wk-stats { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
  .wk-stats b { display: block; font-size: 16px; color: var(--text); font-variant-numeric: tabular-nums; }
  .exb { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .exb-h { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  /* Warm-up and workout headings in the logger */
  .wk-sec { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
  .wk-sec b { display: block; font-size: 15px; }
  .wk-sec small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .wk-sec.warm { padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); }
  .exb.warm { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  /* The exercise's demo, looping, small; tap for the full how-to. */
  .exb-demo { position: relative; flex-shrink: 0; width: 96px; height: 64px; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #eef2f7; cursor: pointer; }
  .exb-demo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .3s ease; }
  .exb-demo.drawn img { object-fit: contain; }
  .exb-demo .f1 { opacity: 0; }
  .exb-demo.end .f1 { opacity: 1; }
  .exb-demo:hover { border-color: var(--accent); }
  @media (max-width: 720px) { .exb-demo { width: 78px; height: 52px; } }
  .exb-h .nm { flex: 1; min-width: 0; font-size: 15px; font-weight: 700; color: var(--accent); background: none; border: 0; text-align: left; cursor: pointer; padding: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exb-note { width: 100%; background: none; border: 0; color: var(--text-2); font-size: 13px; padding: 2px 0 8px; }
  .exb-note:focus { outline: none; color: var(--text); }
  .sets { width: 100%; border-collapse: separate; border-spacing: 0 4px; }
  .sets th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; text-align: center; padding: 0 4px 2px; }
  .sets td { text-align: center; padding: 0 3px; }
  .sets tr.done td { background: color-mix(in srgb, var(--good) 14%, transparent); }
  .sets tr.done td:first-child { border-radius: 9px 0 0 9px; }
  .sets tr.done td:last-child { border-radius: 0 9px 9px 0; }
  .sets .k { width: 34px; height: 30px; border: 0; border-radius: 8px; background: var(--card-2); font-weight: 700; font-size: 13px; cursor: pointer; }
  .sets .k.w { color: var(--warn); } .sets .k.d { color: var(--accent-2); } .sets .k.f { color: var(--danger); }
  .sets .prev { color: var(--muted); font-size: 12.5px; white-space: nowrap; cursor: pointer; min-width: 60px; }
  .sets input { width: 100%; max-width: 92px; height: 32px; text-align: center; border-radius: 8px; border: 1px solid transparent; background: var(--card-2); font-weight: 650; font-variant-numeric: tabular-nums; padding: 0 4px; }
  .sets input:focus { outline: none; border-color: var(--accent); }
  .sets input::placeholder { color: var(--muted); font-weight: 500; }
  .sets .ok { width: 34px; height: 30px; border-radius: 8px; border: 0; background: var(--card-2); color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; }
  .sets tr.done .ok { background: var(--good); color: #fff; }
  .sets .del { opacity: .5; }
  .sets .del:hover { opacity: 1; color: var(--danger); }
  .pr-badge { display: inline-block; font-size: 10px; font-weight: 800; color: #1a1300; background: var(--warn); border-radius: 4px; padding: 1px 4px; margin-left: 4px; vertical-align: 1px; }

  /* rest timer */
  .rest { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); z-index: 40; display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 18px; border-radius: 16px; background: var(--card); border: 1px solid var(--line-2); box-shadow: var(--shadow); min-width: min(380px, calc(100vw - 24px)); overflow: hidden; }
  .rest .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); transition: width 1s linear; }
  .rest b { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; flex: 1; }
  .rest small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

  /* lists */
  .list { display: grid; gap: 10px; }
  .item { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
  .item:hover { border-color: var(--line-2); }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-size: 14.5px; font-weight: 700; margin-bottom: 3px; }
  .item .t p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .item .meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-2); margin-top: 8px; }
  .item .exlist { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--text-2); display: grid; gap: 2px; }
